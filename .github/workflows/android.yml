name: Android
on:
  push:
    branches: [main, dev]
    paths-ignore: ['docs/stars/**']
  pull_request:
    paths-ignore: ['docs/stars/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest testPlayUnitTest lintDebug lintPlay assembleDebug bundlePlay
      - name: Verify Play variant
        run: node tools/verify-play.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Musonic-development-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
